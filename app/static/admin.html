<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin panel — Minimal Chat</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/pwa.js" defer></script>
<script src="/static/admin.js" defer></script>
</head>
<body>
<button class="btn btn-secondary btn-icon theme-float" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
<div class="center">
  <!-- login view -->
  <form class="card" id="login-view">
    <h1>Admin panel</h1>
    <p class="sub">Restricted area. Attempts are rate-limited.</p>
    <label class="label" for="password">Admin password</label>
    <input class="input" id="password" type="password" autocomplete="current-password" required>
    <div class="alert alert-destructive hidden" id="login-error" role="alert"></div>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <!-- panel view -->
  <div class="card wide-card hidden" id="panel-view">
    <div class="admin-head">
      <div>
        <h1>Users</h1>
        <p class="sub" id="user-count"></p>
      </div>
      <button class="btn btn-outline btn-sm" id="logout" type="button">Logout</button>
    </div>
    <form class="admin-add" id="add-form">
      <input class="input" id="add-name" type="text" placeholder="Name" maxlength="64" required>
      <input class="input" id="add-username" type="text" placeholder="username" maxlength="32" required>
      <input class="input" id="add-password" type="password" placeholder="Password" maxlength="128" required>
      <input class="input" id="add-confirm" type="password" placeholder="Confirm" maxlength="128" required>
      <button class="btn" type="submit">Add user</button>
    </form>
    <div class="alert alert-destructive hidden" id="panel-error" role="alert"></div>
    <div id="users"></div>
  </div>
</div>
</body>
</html>
