<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Minimal Chat</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/enc.js"></script>
<script src="/static/api.js"></script>
</head>
<body>
<button class="btn btn-secondary btn-icon theme-float" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
<div class="center">
  <form class="card" id="form">
    <h1>Welcome back</h1>
    <p class="sub">Log in to join the chat.</p>
    <label class="label" for="username">Username</label>
    <input class="input" id="username" type="text" autocomplete="username" maxlength="32" required>
    <label class="label" for="password">Password</label>
    <input class="input" id="password" type="password" autocomplete="current-password" maxlength="128" required>
    <div class="alert alert-destructive hidden" id="error" role="alert"></div>
    <button class="btn btn-block" type="submit">Log in</button>
    <p class="switch" id="register-link">No account? <a href="/register">Register</a></p>
  </form>
</div>
<script>
const form = document.getElementById('form');
const err = document.getElementById('error');
function show(msg) {
  err.textContent = msg;
  err.classList.remove('hidden');   // toggle the class, not style.display
}
Api.boot().then((st) => {
  if (!st.config.registration_enabled) {
    document.getElementById('register-link').classList.add('hidden');
  }
  return Api.me().then((u) => { location.href = '/chat'; }).catch(() => {});
}).catch((e) => { show('Encrypted channel unavailable: ' + e.message); });
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.add('hidden');
  const btn = form.querySelector('button');
  btn.disabled = true;
  try {
    await Api.login(document.getElementById('username').value.trim(),
                    document.getElementById('password').value);
    location.href = '/chat';
  } catch (ex) {
    show(ex.message || 'Login failed.');
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
