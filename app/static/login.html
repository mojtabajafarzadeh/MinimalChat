<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Minimal Chat</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/pwa.js" defer></script>
<script src="/static/enc.js"></script>
<script src="/static/api.js"></script>
<script src="/static/identity.js" defer></script>
<script src="/static/login.js" defer></script>
</head>
<body>
<button class="btn btn-secondary btn-icon theme-float" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
<div class="center">
  <form class="card" id="form">
    <h1>Welcome back</h1>
    <p class="sub">Log in to join the chat.</p>
    <label class="label" for="username">Username</label>
    <input class="input" id="username" type="text" autocomplete="username" maxlength="32" required>
    <label class="label" for="password">Password</label>
    <input class="input" id="password" type="password" autocomplete="current-password" maxlength="128" required>
    <div class="alert alert-destructive hidden" id="error" role="alert"></div>
    <button class="btn btn-block" type="submit">Log in</button>
    <p class="switch" id="register-link">No account? <a href="/register">Register</a></p>
    <div id="identity-panel"></div>
  </form>
</div>
</body>
</html>
