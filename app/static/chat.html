<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat room — MChat</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/pwa.js" defer></script>
<script src="/static/enc.js"></script>
<script src="/static/api.js"></script>
<script src="/static/identity.js" defer></script>
</head>
<body>
<div class="chat-wrap wide">
  <header class="chat-header">
    <button class="btn btn-ghost btn-icon sidebar-toggle" id="sidebar-toggle"
            type="button" aria-label="Show conversations" aria-expanded="false"
            aria-controls="sidebar">☰</button>
    <span class="me" id="me">…</span>
    <button class="btn btn-ghost btn-icon icon-btn" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
    <button class="btn btn-ghost btn-icon icon-btn hidden" id="notif-toggle"
            type="button" aria-pressed="false" aria-label="Turn on desktop notifications">🔕</button>
    <button class="logout" id="logout" type="button">Logout</button>
  </header>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <div id="split-warning" class="split-warning hidden" role="status"></div>
  <div id="security" class="security hidden"></div>
  <div id="identity-panel"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="conv active" id="btn-public"><span class="conv-name"># Public Chat</span><span class="conv-badge hidden" aria-hidden="true"></span></button>
      <hr class="separator">
      <div class="side-title">Private messages</div>
      <form class="dm-start" id="dm-form">
        <input class="input" id="dm-input" type="text" placeholder="@username" maxlength="32" autocomplete="off">
        <button class="btn btn-secondary btn-sm" type="submit" title="Start private chat">Chat</button>
      </form>
      <div class="alert alert-destructive hidden" id="dm-error" role="alert"></div>
      <div id="conversations"></div>
    </aside>
    <div class="main">
      <div class="status" id="status">Connecting…</div>
      <div class="view-title" id="view-title">Public Chat</div>
      <div id="messages"></div>
      <div id="reply-bar" class="reply-bar hidden">
        <span>Replying to <strong id="reply-to"></strong></span>
        <button id="reply-cancel" type="button" title="Cancel reply" aria-label="Cancel reply">×</button>
      </div>
      <form class="composer" id="form">
        <input class="input" id="input" type="text" placeholder="Type a message…" maxlength="1000" autocomplete="off">
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
