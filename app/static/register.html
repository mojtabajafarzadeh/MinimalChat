<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Minimal Chat</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/enc.js"></script>
<script src="/static/api.js"></script>
</head>
<body>
<button class="theme-float" data-theme-toggle type="button">🌙</button>
<div class="center">
  <form class="card" id="form">
    <h1>Create account</h1>
    <p class="sub">Pick a username and start chatting.</p>
    <label for="name">Name</label>
    <input id="name" type="text" autocomplete="name" maxlength="64" required>
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" maxlength="32" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password" maxlength="128" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" autocomplete="new-password" maxlength="128" required>
    <div class="error" id="error"></div>
    <button class="btn" type="submit">Register</button>
    <p class="switch">Have an account? <a href="/login">Log in</a></p>
  </form>
</div>
<script>
const form = document.getElementById('form');
const err = document.getElementById('error');
function show(msg) { err.textContent = msg; err.style.display = 'block'; }
Api.boot().then((st) => {
  if (!st.config.registration_enabled) {
    show('Registration is disabled on this server.');
    form.querySelector('button').disabled = true;
  }
}).catch((e) => { show('Encrypted channel unavailable: ' + e.message); });
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.style.display = 'none';
  const btn = form.querySelector('button');
  btn.disabled = true;
  try {
    await Api.register(document.getElementById('name').value.trim(),
                       document.getElementById('username').value.trim(),
                       document.getElementById('password').value,
                       document.getElementById('confirm').value);
    location.href = '/chat';
  } catch (ex) {
    show(ex.message || 'Registration failed.');
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
