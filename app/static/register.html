<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Minimal Chat</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/enc.js"></script>
<script src="/static/api.js"></script>
<script src="/static/identity.js" defer></script>
<script src="/static/register.js" defer></script>
</head>
<body>
<button class="btn btn-secondary btn-icon theme-float" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
<div class="center">
  <form class="card" id="form">
    <h1>Create account</h1>
    <p class="sub">Pick a username and start chatting.</p>
    <label class="label" for="name">Name</label>
    <input class="input" id="name" type="text" autocomplete="name" maxlength="64" required>
    <label class="label" for="username">Username</label>
    <input class="input" id="username" type="text" autocomplete="username" maxlength="32" required>
    <label class="label" for="password">Password</label>
    <input class="input" id="password" type="password" autocomplete="new-password" maxlength="128" required>
    <label class="label" for="confirm">Confirm password</label>
    <input class="input" id="confirm" type="password" autocomplete="new-password" maxlength="128" required>
    <div class="alert alert-destructive hidden" id="error" role="alert"></div>
    <button class="btn btn-block" type="submit">Register</button>
    <p class="switch">Have an account? <a href="/login">Log in</a></p>
    <div id="identity-panel"></div>
  </form>
</div>
</body>
</html>
